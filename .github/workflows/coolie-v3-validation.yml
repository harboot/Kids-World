name: Temporary Coolie V3 validation
on:
  push:
    branches: [feature/coolie-v3]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Render actual mesh front and side
        run: |
          cat > coolie-preview-temp.html <<'HTML'
          <!doctype html><html><head><style>body{margin:0;background:#ddd2bd}canvas{display:block}</style></head><body><script type="module">
          import * as T from './vendor/three.module.min.js';
          import {buildCoolie,cooliePosition} from './areas/kung-fu-hustle/coolie.js';
          const s=new T.Scene();s.background=new T.Color(0xcbbda5);
          buildCoolie(T,s,{solid(){}});
          const root=s.getObjectByName('Coolie — porter');
          root.position.set(0,.0,0);root.rotation.y=0;
          s.remove(s.getObjectByName('Coolie ground sacks'));
          const ground=new T.Mesh(new T.PlaneGeometry(20,20),new T.MeshStandardMaterial({color:0xb5a18a}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;s.add(ground);
          s.add(new T.HemisphereLight(0xffeee0,0x867866,1.55));
          const light=new T.DirectionalLight(0xffe2bd,2.4);light.position.set(-3,5,4);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.left=-3;light.shadow.camera.right=3;light.shadow.camera.top=3;light.shadow.camera.bottom=-3;s.add(light);
          const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(720,540);r.shadowMap.enabled=true;r.setScissorTest(true);document.body.appendChild(r.domElement);
          const cam=new T.PerspectiveCamera(34,360/540,.1,50);
          for(const [i,x,z] of [[0,1.2,5.5],[1,5.2,1.5]]){cam.position.set(x,2.05,z);cam.lookAt(0,1.42,0);r.setViewport(i*360,0,360,540);r.setScissor(i*360,0,360,540);r.render(s,cam);}
          document.title='rendered'; window.previewReady=true;
          </script></body></html>
          HTML
          python3 -m http.server 8765 >/tmp/preview-server.log 2>&1 &
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --hide-scrollbars --window-size=720,540 --remote-debugging-port=9222 --user-data-dir=/tmp/coolie-chrome about:blank >/tmp/chrome.log 2>&1 &
          node --input-type=module <<'JS'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let page;
          for(let i=0;i<30;i++){try{page=(await (await fetch('http://127.0.0.1:9222/json/list')).json()).find(x=>x.type==='page');if(page)break}catch{}await sleep(500)}
          if(!page)throw Error('Chrome unavailable');
          const socket=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{socket.onopen=resolve;socket.onerror=reject});
          let id=0;const pending=new Map();
          socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.id){const p=pending.get(m.id);pending.delete(m.id);if(m.error)p.reject(Error(JSON.stringify(m.error)));else p.resolve(m.result)}else if(m.method==='Runtime.exceptionThrown')console.log('PAGE_EXCEPTION',JSON.stringify(m.params.exceptionDetails));else if(m.method==='Log.entryAdded')console.log('PAGE_LOG',JSON.stringify(m.params.entry));};
          const call=(method,params={})=>new Promise((resolve,reject)=>{const key=++id;pending.set(key,{resolve,reject});socket.send(JSON.stringify({id:key,method,params}));});
          await call('Runtime.enable');await call('Log.enable');await call('Page.enable');
          await call('Emulation.setDeviceMetricsOverride',{width:720,height:540,deviceScaleFactor:1,mobile:false});
          await call('Page.navigate',{url:'http://127.0.0.1:8765/coolie-preview-temp.html'});
          let ready=false;
          for(let i=0;i<40;i++){await sleep(500);const r=await call('Runtime.evaluate',{expression:'Boolean(window.previewReady)',returnByValue:true});if(r.result.value){ready=true;break}}
          if(!ready){console.log(await call('Runtime.evaluate',{expression:'document.body.innerHTML.slice(0,250)',returnByValue:true}));throw Error('Preview did not render')}
          await sleep(1000);
          const {data}=await call('Page.captureScreenshot',{format:'jpeg',quality:70,fromSurface:true});
          console.log('PREVIEW_BASE64_START');for(let i=0;i<data.length;i+=120)console.log(data.slice(i,i+120));console.log('PREVIEW_BASE64_END');socket.close();
          JS
          rm coolie-preview-temp.html
