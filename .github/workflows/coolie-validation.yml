name: Temporary Coolie detail validation
on:
  push:
    branches: [feature/coolie-detail]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/generate-area-stats.mjs
      - run: node scripts/generate-pwa-manifest.mjs
      - run: node --test
      - run: node scripts/generate-pwa-manifest.mjs --check
      - run: node scripts/generate-area-stats.mjs --check
      - name: Measure porter geometry
        run: |
          node --input-type=module -e "import * as T from './vendor/three.module.min.js'; import {coolieGeometry,sackGeometry} from './areas/kung-fu-hustle/coolie.js'; let b=coolieGeometry(T),s=sackGeometry(T); console.log(JSON.stringify({body:b.attributes.position.count/3,sack:s.attributes.position.count/3,total:(b.attributes.position.count+22*s.attributes.position.count)/3,uniqueBufferBytes:[b,s].flatMap(g=>Object.values(g.attributes)).reduce((n,a)=>n+a.array.byteLength,0)}))"
      - name: Commit generated release to feature branch
        run: |
          git add -- area-catalog.js area-stats.json version.json sw.js
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Generate validated Coolie detail release'
            git push origin HEAD:feature/coolie-detail
          fi
