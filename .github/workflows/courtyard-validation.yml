name: Temporary courtyard layout validation
on:
  push:
    branches: [feature/courtyard-kiosks-breach]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/generate-area-stats.mjs
      - run: node scripts/generate-pwa-manifest.mjs
      - run: node --test
      - run: node scripts/generate-pwa-manifest.mjs --check
      - run: node scripts/generate-area-stats.mjs --check
      - name: Commit generated release to feature branch
        run: |
          git add -- area-catalog.js area-stats.json version.json sw.js
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Generate validated courtyard release'
            git push origin HEAD:feature/courtyard-kiosks-breach
          fi
