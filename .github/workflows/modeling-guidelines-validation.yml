name: Temporary modeling guidelines validation
on:
  push:
    branches: [docs/relax-modeling-guidelines]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test
      - run: node scripts/generate-pwa-manifest.mjs --check
      - run: node scripts/generate-area-stats.mjs --check
