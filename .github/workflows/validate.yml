name: Validate release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare the release generated for this push
        if: github.event_name == 'push'
        run: |
          node scripts/generate-area-stats.mjs
          node scripts/generate-pwa-manifest.mjs
      - run: node scripts/generate-pwa-manifest.mjs --check
      - run: node --test
