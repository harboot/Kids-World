<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9eedc">
  <title>Kids World</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./pwa/loading.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./pwa/bootstrap.js"></script>
</head>
<body>
  <section id="pwa-splash" aria-labelledby="pwa-title">
    <div class="pwa-cloud pwa-cloud-left" aria-hidden="true"></div>
    <div class="pwa-cloud pwa-cloud-right" aria-hidden="true"></div>
    <div class="pwa-card">
      <div class="pwa-mark" aria-hidden="true"></div>
      <h1 id="pwa-title">Kids World</h1>
      <p id="pwa-status" role="status">Checking for updates…</p>
      <div id="pwa-progress-panel">
        <div class="pwa-meter">
          <progress id="pwa-progress" aria-label="Game files ready" max="1"></progress>
          <span id="pwa-percent" aria-hidden="true"></span>
        </div>
        <p id="pwa-count"></p>
      </div>
      <button id="pwa-play" type="button" hidden>Play <span aria-hidden="true">→</span></button>
      <button id="pwa-retry" type="button" hidden>Try again</button>
    </div>
  </section>
  <aside id="pwa-update" hidden>
    <span>A new adventure update is ready.</span>
    <button id="pwa-reload" type="button">Reload to update</button>
  </aside>
  <template id="game-shell">
  <main id="game" data-level="garden" data-state="loading" data-input="mouse">
    <canvas id="view" aria-label="3D flower garden"></canvas>

    <header class="hud">
      <div class="wordmark">
        <span class="world-mark" aria-hidden="true"></span>
        <span>Kids World <small>Flower Garden</small></span>
      </div>
      <div class="hud-actions">
        <button id="sound" class="hud-button sound-button" type="button" aria-label="Mute sound" aria-pressed="false" hidden>♪</button>
        <button id="choose-level" class="hud-button" type="button" aria-label="Choose level" title="Choose level" aria-haspopup="dialog" disabled>☷</button>
        <button id="fullscreen" class="hud-button" type="button" aria-label="Fullscreen" title="Fullscreen" hidden>⛶</button>
      </div>
      <p id="objective" class="objective" role="status"></p>
    </header>

    <button id="interaction" class="interaction" type="button" hidden>
      <span id="interaction-glyph" class="interaction-circle" aria-hidden="true"></span>
      <span id="interaction-label" class="interaction-label"></span>
    </button>

    <section id="menu" class="menu" aria-labelledby="menu-title">
      <div class="menu-content">
        <h1 id="menu-title">Flower <span>Garden</span></h1>
        <p id="menu-message" class="menu-message">Take the hill trail, cross the fish pond, or bring apples to the cabin.</p>
        <button id="start" class="start-button" type="button" disabled>
          <span id="start-label">Explore</span><span aria-hidden="true">→</span>
        </button>
        <p id="notice" class="notice" role="status">Loading the garden…</p>
        <div class="guide desktop-guide" aria-label="Desktop controls">
          <div><kbd>W A S D</kbd><span>Move</span></div>
          <div><kbd>Arrow keys</kbd><span>Look</span></div>
          <div><kbd>Click scene</kbd><span>Enable mouse look</span></div>
          <div><kbd>Space</kbd><span>Jump</span></div>
          <div><kbd>M</kbd><span>Interact</span></div>
          <div><kbd>Esc</kbd><span>Pause</span></div>
        </div>
        <div class="guide touch-guide" aria-label="Touch controls">
          <div><kbd>Left stick</kbd><span>Move</span></div>
          <div><kbd>Drag right side</kbd><span>Look</span></div>
          <div><kbd>Tap scene</kbd><span>Jump</span></div>
          <div><kbd>Tap circle</kbd><span>Interact</span></div>
        </div>
      </div>
    </section>

    <dialog id="level-picker" aria-labelledby="level-picker-title">
      <header class="level-picker-header">
        <h2 id="level-picker-title">Choose level</h2>
        <form method="dialog"><button class="hud-button" aria-label="Close level picker" autofocus>×</button></form>
      </header>
      <div id="completed-levels" class="completed-levels"></div>
      <button id="restart" class="restart-level" type="button" disabled>Restart area</button>
    </dialog>

    <div id="joystick" class="joystick" role="group" aria-label="Movement joystick">
      <span id="joystick-thumb" class="joystick-thumb" aria-hidden="true"></span>
    </div>
  </main>
  </template>
</body>
</html>
