<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9eedc">
  <title>Kids World</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./pwa/loading.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./pwa/bootstrap.js"></script>
</head>
<body>
  <section id="pwa-splash" aria-labelledby="pwa-title">
    <div class="pwa-cloud pwa-cloud-left" aria-hidden="true"></div>
    <div class="pwa-cloud pwa-cloud-right" aria-hidden="true"></div>
    <div class="pwa-card">
      <div class="pwa-mark" aria-hidden="true"></div>
      <h1 id="pwa-title">Kids World</h1>
      <p id="pwa-status" role="status">Checking for updates…</p>
      <div id="pwa-progress-panel">
        <div class="pwa-meter">
          <progress id="pwa-progress" aria-label="Game files ready" max="1"></progress>
          <span id="pwa-percent" aria-hidden="true"></span>
        </div>
      </div>
      <p id="pwa-version">Checking version…</p>
      <button id="pwa-play" type="button" hidden>Play <span aria-hidden="true">→</span></button>
      <button id="pwa-retry" type="button" hidden>Try again</button>
    </div>
  </section>
  <aside id="pwa-update" hidden>
    <span>A new adventure update is ready.</span>
    <button id="pwa-reload" type="button">Reload to update</button>
  </aside>
  <template id="game-shell">
  <main id="game" data-level="garden" data-state="loading" data-input="mouse">
    <canvas id="view" aria-label="3D flower garden"></canvas>

    <header class="hud">
      <div class="wordmark">
        <span class="world-mark" aria-hidden="true"></span>
        <span>Kids World <small>Flower Garden</small></span>
      </div>
      <p id="mission-toast" class="mission-toast" role="status"></p>
      <div class="hud-actions">
        <button id="open-settings" class="hud-button" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog" disabled>⚙︎</button>
        <button id="choose-level" class="hud-button" type="button" aria-label="Choose area" title="Choose area" aria-haspopup="dialog" disabled>☷</button>
        <button id="fullscreen" class="hud-button" type="button" aria-label="Fullscreen" title="Fullscreen" hidden>⛶</button>
      </div>
      <details id="mission-hud" class="mission-hud">
        <summary>Missions <span id="mission-summary" class="mission-count">0/0</span><span class="mission-arrow" aria-hidden="true"></span></summary>
        <div id="mission-panel" class="mission-panel" role="region" aria-label="Mission details" tabindex="0">
          <ul id="mission-list" class="mission-list" role="list"></ul>
          <section id="mission-hint" class="mission-note" hidden>
            <h2>Hint</h2>
            <p id="mission-hint-text"></p>
          </section>
          <section id="mission-inventory" class="mission-note" hidden>
            <h2>Inventory</h2>
            <p id="mission-inventory-text"></p>
          </section>
        </div>
      </details>
    </header>

    <div id="fps-meter" class="fps-meter" hidden></div>

    <button id="interaction" class="interaction" type="button" hidden>
      <span id="interaction-glyph" class="interaction-circle" aria-hidden="true"></span>
      <span id="interaction-label" class="interaction-label"></span>
    </button>

    <div id="drone-marker" class="drone-marker" aria-hidden="true" hidden></div>
    <aside id="drone-panel" class="drone-panel" aria-labelledby="drone-title" hidden>
      <h2 id="drone-title">Drone View</h2>
      <p id="drone-area" class="drone-area"></p>
      <output id="drone-coordinates" class="drone-coordinates" hidden></output>
      <p id="drone-feedback" class="drone-feedback" role="status"></p>
      <div class="drone-actions">
        <button id="drone-copy" type="button" disabled>Copy Coordinates</button>
        <button id="drone-reset" type="button">Reset View</button>
        <button id="drone-exit" type="button">Exit Drone</button>
      </div>
    </aside>

    <section id="menu" class="menu" aria-labelledby="menu-title">
      <div class="menu-content">
        <h1 id="menu-title">Flower <span>Garden</span></h1>
        <p id="menu-message" class="menu-message">Take the hill trail, cross the fish pond, or bring apples to the cabin.</p>
        <button id="start" class="start-button" type="button" disabled>
          <span id="start-label">Explore</span><span aria-hidden="true">→</span>
        </button>
        <button id="pause-reset" class="drone-entry" type="button">Reset</button>
        <button id="open-drone" class="drone-entry" type="button" hidden>Drone View</button>
        <p id="notice" class="notice" role="status">Loading the garden…</p>
        <a id="area-retry" class="drone-entry" hidden>Reload area</a>
        <div class="guide desktop-guide" aria-label="Desktop controls">
          <div class="stick-steering"><kbd>W S</kbd><span>Move</span></div>
          <div class="stick-steering"><kbd>A D</kbd><span>Turn</span></div>
          <div class="stick-strafing"><kbd>W A S D</kbd><span>Move</span></div>
          <div><kbd>Arrow keys</kbd><span>Look</span></div>
          <div><kbd>Click scene</kbd><span>Enable mouse look</span></div>
          <div><kbd>Space</kbd><span>Jump / Interact</span></div>
          <div><kbd>Esc</kbd><span>Pause</span></div>
        </div>
        <div class="guide touch-guide" aria-label="Touch controls">
          <div class="stick-steering"><kbd>Joystick</kbd><span>Move and turn</span></div>
          <div class="stick-strafing"><kbd>Joystick</kbd><span>Move</span></div>
          <div class="stick-steering"><kbd>Drag right side</kbd><span>Look up or down</span></div>
          <div class="stick-strafing"><kbd>Drag right side</kbd><span>Look</span></div>
          <div><kbd>Tap scene</kbd><span>Jump</span></div>
          <div><kbd>Tap circle</kbd><span>Interact</span></div>
        </div>
      </div>
    </section>

    <dialog id="settings" class="game-dialog" aria-labelledby="settings-title">
      <header class="dialog-header">
        <h2 id="settings-title">Settings</h2>
        <form method="dialog"><button class="hud-button" aria-label="Close settings" autofocus>×</button></form>
      </header>
      <button id="sound" class="sound-setting" type="button" aria-label="Mute sound" aria-pressed="false" hidden>Sound: On</button>
      <div class="speed-options">
        <label for="sound-volume">Sound volume <output id="sound-volume-value" for="sound-volume">96%</output></label>
        <input id="sound-volume" type="range" min="0" max="100" step="1" value="96">
        <label for="turn-speed">Turn speed <output id="turn-speed-value" for="turn-speed">100%</output></label>
        <input id="turn-speed" type="range" min="50" max="100" step="1" value="100">
        <label for="move-speed">Movement speed <output id="move-speed-value" for="move-speed">100%</output></label>
        <input id="move-speed" type="range" min="50" max="100" step="1" value="100">
      </div>
      <fieldset class="control-options">
        <legend>Control mode</legend>
        <label>
          <input id="controls-one-finger" type="radio" name="controls" value="one-finger" checked>
          <span><strong>One finger</strong><small>Joystick or W / S to move. Joystick or A / D to turn.</small></span>
        </label>
        <label>
          <input id="controls-two-finger" type="radio" name="controls" value="two-finger">
          <span><strong>Two fingers</strong><small>Joystick or WASD to move and strafe. Drag the right side or use the mouse to look.</small></span>
        </label>
      </fieldset>
    </dialog>

    <dialog id="level-picker" class="game-dialog" aria-labelledby="level-picker-title">
      <header class="dialog-header">
        <h2 id="level-picker-title">Choose area</h2>
        <form method="dialog"><button class="hud-button" aria-label="Close area picker" autofocus>×</button></form>
      </header>
      <div id="area-list" class="area-list"></div>
      <button id="restart" class="restart-level" type="button" disabled>Restart area</button>
    </dialog>

    <div id="joystick" class="joystick" role="group" aria-label="Movement joystick">
      <span id="joystick-thumb" class="joystick-thumb" aria-hidden="true"></span>
    </div>
  </main>
  </template>
</body>
</html>
