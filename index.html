<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181d1c">
  <title>Dustline — 3D Target Range</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.js"></script>
</head>
<body>
  <main id="game" data-state="loading" data-input="mouse">
    <canvas id="view" aria-label="Arena latihan tembak 3D"></canvas>

    <header class="hud">
      <div class="wordmark">
        <span class="range-mark" aria-hidden="true"></span>
        <span>DUSTLINE <small>TARGET RANGE</small></span>
      </div>
      <div class="hud-right">
        <div class="score">
          <span>SKOR</span>
          <output id="score" aria-label="Skor" aria-live="polite">000</output>
        </div>
        <button id="restart" class="hud-button" type="button" disabled>
          <span aria-hidden="true" class="reset-mark">↻</span><span>RESTART</span>
        </button>
        <button id="fullscreen" class="hud-button fullscreen-button" type="button"
                aria-label="Layar penuh" title="Layar penuh" hidden>
          <span class="fullscreen-mark" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <div class="crosshair" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
    <div class="damage-frame" aria-hidden="true"></div>

    <section id="menu" class="menu" aria-labelledby="menu-title">
      <div class="menu-content">
        <p class="eyebrow">ARENA LATIHAN 3D</p>
        <h1 id="menu-title">DUST<span>LINE</span></h1>
        <p id="menu-message" class="menu-message">Bidik target di arena dan kumpulkan skor.</p>
        <button id="start" class="start-button" type="button" disabled>
          <span id="start-label">START GAME</span><span class="play-mark" aria-hidden="true"></span>
        </button>
        <p id="notice" class="notice" role="status">Memuat arena…</p>
        <div class="guide desktop-guide" aria-label="Kontrol desktop">
          <div><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>Bergerak</span></div>
          <div><span class="keys"><kbd>Mouse</kbd></span><span>Bidik</span></div>
          <div><span class="keys"><kbd>Klik</kbd><kbd>Space</kbd></span><span>Tembak</span></div>
          <div><span class="keys"><kbd>Esc</kbd></span><span>Jeda</span></div>
        </div>
        <div class="guide touch-guide" aria-label="Kontrol smartphone">
          <div><span class="keys"><kbd>↑</kbd><kbd>←</kbd><kbd>→</kbd></span><span>Bergerak</span></div>
          <div><span class="keys"><kbd>↓</kbd></span><span>Tembak</span></div>
          <div><span>Geser sisi kanan untuk membidik</span></div>
        </div>
        <p class="orientation">Putar ponsel ke landscape agar area bidik lebih luas.</p>
      </div>
    </section>

    <div class="dpad" role="group" aria-label="Kontrol gerak dan tembak">
      <button type="button" data-action="forward" aria-label="Maju"><span class="arrow"></span></button>
      <button type="button" data-action="left" aria-label="Ke kiri"><span class="arrow"></span></button>
      <button type="button" data-action="right" aria-label="Ke kanan"><span class="arrow"></span></button>
      <button type="button" data-action="fire" aria-label="Tembak dengan tombol bawah">
        <span class="arrow"></span><span class="fire-label">TEMBAK</span>
      </button>
    </div>
  </main>
</body>
</html>
