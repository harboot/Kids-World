<!doctype html>
<html lang="en" data-stats-url="./area-stats.json">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9eedc">
  <title>Area Statistics · Kids World</title>
  <link rel="icon" href="./assets/icons/icon-192.png">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #253e29;
      background: #e9eedc;
      --ink: #253e29;
      --muted: #51614f;
      --surface: #fffdf5;
      --line: #d9e0cd;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    a { color: #315d3c; }
    :focus-visible { outline: 2px solid #286b54; outline-offset: 3px; }
    .wrap { width: min(100% - 2rem, 64rem); margin-inline: auto; }
    .site-header { border-bottom: 1px solid var(--line); background: #f7f8ed; }
    .site-header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 4.25rem;
    }
    .wordmark { display: flex; align-items: center; gap: .65rem; font-weight: 850; }
    .wordmark img { width: 2.25rem; height: 2.25rem; border-radius: .65rem; }
    .game-link { padding-block: .6rem; font-size: .9rem; font-weight: 750; }
    main { padding-block: clamp(1.5rem, 4vw, 3.5rem) 3rem; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.1; letter-spacing: -.045em; }
    h2 { margin: 0; font-size: 1.3rem; letter-spacing: -.02em; }
    .description { margin: .7rem 0 1.5rem; color: var(--muted); }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(10rem, 100%), 1fr));
      gap: .65rem;
      margin: 0 0 1.5rem;
    }
    .summary > div {
      display: flex;
      flex-direction: column;
      gap: .38rem;
      min-width: 0;
      padding: .85rem 1rem;
      border: 1px solid var(--line);
      border-radius: .85rem;
      background: var(--surface);
    }
    dt { color: var(--muted); font-size: .78rem; font-weight: 750; }
    dd { margin: 0; font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    #last-update { font-size: 1.12rem; }
    .secondary { display: block; margin-top: .22rem; color: var(--muted); font-size: .8rem; font-weight: 550; }
    .inventory { border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); }
    .inventory-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .8rem 1.5rem;
      padding: 1rem;
    }
    .controls { display: flex; flex-wrap: wrap; gap: .75rem; }
    label { display: grid; gap: .25rem; color: var(--muted); font-size: .78rem; font-weight: 750; }
    input, select {
      min-height: 2.5rem;
      padding: .4rem .65rem;
      border: 1px solid #a6b39c;
      border-radius: .45rem;
      background: #fff;
      color: var(--ink);
      font: 1rem system-ui, sans-serif;
    }
    input { width: min(15rem, 100%); }
    .table-scroll { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .86rem;
      font-variant-numeric: tabular-nums;
    }
    th, td { padding: .77rem .55rem; border-block-start: 1px solid var(--line); text-align: right; }
    tr > :nth-child(-n+2) { text-align: left; }
    thead th { padding: 0; background: #eff3e5; }
    thead button {
      display: flex;
      align-items: center;
      justify-content: end;
      gap: .25rem;
      width: 100%;
      padding: .77rem .55rem;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: inherit;
      cursor: pointer;
    }
    thead th:nth-child(-n+2) button { justify-content: start; }
    thead button:hover, thead th[aria-sort] { background: #e3ecd6; }
    thead button:focus-visible { outline-offset: -3px; }
    .json-heading { padding: .77rem .55rem; }
    .sort-icon { width: .8em; color: #63745d; }
    tbody tr:nth-child(even) { background: #f8f9ee; }
    tbody a { text-underline-offset: .18em; }
    .area-identity { display: flex; align-items: center; gap: .85rem; }
    .thumbnail-link { display: block; flex: none; border-radius: .5rem; }
    .thumbnail-link:hover { box-shadow: 0 0 0 2px #668962; }
    .metric { white-space: nowrap; }
    .metric-label { display: none; }
    .thumbnail {
      display: block;
      width: clamp(6rem, 16vw, 10rem);
      height: auto;
      aspect-ratio: 16 / 9;
      border-radius: .5rem;
      background: #e3ecd6;
      object-fit: cover;
    }
    .visibility { display: inline-block; padding: .18rem .52rem; border-radius: 1rem; font-weight: 700; }
    .public { background: #e2eedc; color: #2c542f; }
    .hidden { background: #f2e9db; color: #6c4b2b; }
    .export-button {
      min-width: 7rem;
      min-height: 2.5rem;
      padding: .35rem .5rem;
      border: 1px solid #a6b39c;
      border-radius: .45rem;
      background: #eff3e5;
      color: var(--ink);
      font: 750 .75rem system-ui, sans-serif;
      cursor: pointer;
    }
    .export-button:hover:not(:disabled) { background: #e3ecd6; }
    .export-button:disabled { color: var(--muted); cursor: wait; }
    .status { margin: 0; padding: .8rem 1rem; border-block-start: 1px solid var(--line); color: var(--muted); font-size: .86rem; }
    #export-error { color: #8b3029; }
    @media (max-width: 42rem) {
      table, thead, tbody { display: block; }
      thead tr { display: flex; flex-wrap: wrap; background: #eff3e5; border-block-start: 1px solid var(--line); }
      thead th { border: 0; }
      thead button { padding: .55rem .65rem; font-size: .78rem; }
      .json-heading { padding: .55rem .65rem; font-size: .78rem; }
      tbody tr {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        align-items: center;
        gap: .65rem .4rem;
        padding: .85rem .7rem;
        border-block-start: 1px solid var(--line);
      }
      tbody th, tbody td { padding: 0; border: 0; }
      tbody th { grid-column: span 3; }
      tbody td:nth-child(2) { justify-self: end; }
      tbody .metric { align-self: start; justify-self: start; text-align: left; }
      tbody .export-cell { grid-column: span 2; justify-self: end; }
      .area-identity { gap: .55rem; }
      .thumbnail { width: clamp(5.6rem, 29vw, 8rem); }
      .metric-label { display: block; margin-bottom: .18rem; color: var(--muted); font-size: .72rem; font-weight: 750; white-space: normal; }
    }
    @media (max-width: 36rem) {
      tbody .metric { grid-column: span 2; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary > div { padding-inline: .7rem; }
      .controls { width: 100%; }
      .search-label { flex: 1; min-width: 8rem; }
      input { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="wordmark"><img src="./assets/icons/icon-192.png" alt=""> Kids World</div>
      <a href="./" class="game-link">Open game</a>
    </div>
  </header>
  <main class="wrap">
    <h1>Area Statistics</h1>
    <p class="description">Map dimensions and repository file sizes by area.</p>
    <dl class="summary" aria-label="Area summary" hidden>
      <div><dt>Last Update</dt><dd id="last-update"></dd></div>
      <div><dt>Public / Hidden Areas</dt><dd id="visibility-counts"></dd></div>
      <div><dt>Total Area Files</dt><dd id="total-files"></dd></div>
      <div><dt>Total Area Size</dt><dd id="total-size"></dd></div>
    </dl>
    <section class="inventory" aria-labelledby="area-list-heading">
      <div class="inventory-header">
        <h2 id="area-list-heading">Areas</h2>
        <div class="controls">
          <label class="search-label">Search area name <input type="search" id="search" placeholder="e.g. Snow Basin" disabled></label>
          <label>Visibility
            <select id="filter" disabled>
              <option value="">All</option>
              <option value="Public">Public</option>
              <option value="Hidden">Hidden</option>
            </select>
          </label>
        </div>
      </div>
      <p id="export-error" class="status" role="alert" hidden></p>
      <div class="table-scroll" role="region" aria-label="Area statistics table" tabindex="0" hidden>
        <table role="table" aria-labelledby="area-list-heading">
          <thead role="rowgroup">
            <tr role="row">
              <th role="columnheader" scope="col" aria-sort="ascending"><button type="button" data-sort="name">Area Name <span class="sort-icon" aria-hidden="true">↑</span></button></th>
              <th role="columnheader" scope="col"><button type="button" data-sort="visibility">Visibility <span class="sort-icon" aria-hidden="true">↕</span></button></th>
              <th role="columnheader" scope="col"><button type="button" data-sort="missionCount">Missions <span class="sort-icon" aria-hidden="true">↕</span></button></th>
              <th role="columnheader" scope="col"><button type="button" data-sort="mapArea" title="Sort by map area">Map Dimensions <span class="sort-icon" aria-hidden="true">↕</span></button></th>
              <th role="columnheader" scope="col"><button type="button" data-sort="jsBytes">JS Size <span class="sort-icon" aria-hidden="true">↕</span></button></th>
              <th role="columnheader" scope="col"><button type="button" data-sort="imageBytes">Image Size <span class="sort-icon" aria-hidden="true">↕</span></button></th>
              <th role="columnheader" scope="col" class="json-heading">JSON</th>
            </tr>
          </thead>
          <tbody role="rowgroup"></tbody>
        </table>
      </div>
      <p id="status" class="status" role="status">Loading area statistics…</p>
      <noscript><p class="status">Enable JavaScript to view area statistics.</p></noscript>
    </section>
  </main>
  <script type="module">
    const number = new Intl.NumberFormat('en', { maximumFractionDigits: 3 });
    const collator = new Intl.Collator('en', { numeric: true });
    const unavailable = '—';
    const date = new Intl.DateTimeFormat('en-GB', {
      day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Jakarta',
    });
    const time = new Intl.DateTimeFormat('en-GB', {
      hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta',
    });
    const size = bytes => bytes >= 1_000_000
      ? `${number.format(bytes / 1_000_000)} MB`
      : `${number.format(bytes / 1_000)} KB`;
    const units = value => value === null ? unavailable : number.format(value);
    const squareUnits = value => value === null ? unavailable : `${units(value)} wu²`;

    const search = document.getElementById('search');
    const filter = document.getElementById('filter');
    const status = document.getElementById('status');
    const exportError = document.getElementById('export-error');
    const sortButtons = document.querySelectorAll('button[data-sort]');
    const body = document.querySelector('tbody');
    const statsPath = document.documentElement.dataset.statsUrl;
    let sortBy = 'name';
    let ascending = true;
    let exportingArea = null;

    function updateExportButton(button) {
      const processing = exportingArea === button.dataset.area;
      button.disabled = exportingArea !== null;
      button.textContent = processing ? 'EXPORTING...' : 'EXPORT';
      button.setAttribute('aria-label',
        processing ? `Exporting ${button.dataset.name} JSON` : `Export ${button.dataset.name} JSON`);
    }

    async function downloadScene(area) {
      if (exportingArea !== null) return;
      exportingArea = area.id;
      exportError.hidden = true;
      const updateButtons = () => body.querySelectorAll('.export-button').forEach(updateExportButton);
      updateButtons();
      try {
        // Cached statistics and their game modules share the same versioned directory.
        const { exportArea } = await import(new URL('game.js', new URL(statsPath, document.baseURI)).href);
        await exportArea(area.id);
      } catch (error) {
        console.error('Kids World could not export the area scene.', error);
        exportError.hidden = false;
        exportError.textContent = `Could not export ${area.name}. ${error.message}`;
      } finally {
        exportingArea = null;
        updateButtons();
      }
    }

    function secondary(value) {
      return Object.assign(document.createElement('span'), { className: 'secondary', textContent: value });
    }

    function showSummary(summary, updatedAt) {
      const values = {
        'visibility-counts': `${number.format(summary.publicAreas)} / ${number.format(summary.hiddenAreas)}`,
        'total-files': number.format(summary.totalFiles),
        'total-size': size(summary.totalBytes),
      };
      for (const [id, value] of Object.entries(values)) document.getElementById(id).textContent = value;
      const updated = document.getElementById('last-update');
      const timestamp = updatedAt ? new Date(updatedAt) : null;
      if (timestamp && Number.isFinite(timestamp.getTime())) {
        const label = document.createElement('time');
        label.setAttribute('datetime', timestamp.toISOString());
        label.textContent = date.format(timestamp);
        label.append(secondary(`${time.format(timestamp)} WIB`));
        updated.append(label);
      } else {
        updated.textContent = 'Unavailable';
      }
      document.querySelector('.summary').hidden = false;
    }

    function compareAreas(first, second) {
      const left = first[sortBy];
      const right = second[sortBy];
      if (left === null) return right === null ? 0 : 1;
      if (right === null) return -1;
      const comparison = typeof left === 'number' ? left - right : collator.compare(left, right);
      return comparison * (ascending ? 1 : -1) || collator.compare(first.name, second.name);
    }

    function areaRow(area) {
      const row = document.createElement('tr');
      row.setAttribute('role', 'row');
      const nameCell = document.createElement('th');
      nameCell.scope = 'row';
      nameCell.setAttribute('role', 'rowheader');
      const link = document.createElement('a');
      link.href = `./?area=${encodeURIComponent(area.id)}`;
      const identity = document.createElement('div');
      identity.className = 'area-identity';
      if (area.thumbnail) {
        const preview = document.createElement('a');
        preview.className = 'thumbnail-link';
        // Cached statistics and their images share a versioned directory.
        preview.href = new URL(area.thumbnail, new URL(statsPath, document.baseURI)).href;
        preview.target = '_blank';
        preview.rel = 'noopener';
        preview.setAttribute('aria-label', `View ${area.name} image (opens in a new tab)`);
        const thumbnail = document.createElement('img');
        thumbnail.className = 'thumbnail';
        thumbnail.width = 160;
        thumbnail.height = 90;
        thumbnail.alt = '';
        thumbnail.decoding = 'async';
        thumbnail.src = preview.href;
        preview.append(thumbnail);
        identity.append(preview);
      }
      link.textContent = area.name;
      identity.append(link);
      nameCell.append(identity);
      row.append(nameCell);

      const badge = document.createElement('span');
      badge.classList.add('visibility', area.visibility.toLowerCase());
      badge.textContent = area.visibility;
      const visibility = row.insertCell();
      visibility.setAttribute('role', 'cell');
      visibility.append(badge);

      const dimensions = area.width === null && area.depth === null
        ? unavailable : `${units(area.width)} × ${units(area.depth)} wu`;
      const files = `${number.format(area.jsFiles)} ${area.jsFiles === 1 ? 'file' : 'files'}`;
      for (const [heading, main, detail] of [
        ['Missions', units(area.missionCount), ''],
        ['Map Dimensions', dimensions, area.mapArea === null ? '' : squareUnits(area.mapArea)],
        ['JS Size', files, size(area.jsBytes)],
        ['Image Size', size(area.imageBytes)],
      ]) {
        const cell = row.insertCell();
        cell.className = 'metric';
        cell.setAttribute('role', 'cell');
        const label = document.createElement('span');
        label.className = 'metric-label';
        label.textContent = heading;
        label.setAttribute('aria-hidden', 'true');
        cell.append(label, main);
        if (detail) cell.append(secondary(detail));
      }
      const exportCell = row.insertCell();
      exportCell.className = 'export-cell';
      exportCell.setAttribute('role', 'cell');
      const exportButton = document.createElement('button');
      exportButton.className = 'export-button';
      exportButton.type = 'button';
      exportButton.dataset.area = area.id;
      exportButton.dataset.name = area.name;
      updateExportButton(exportButton);
      exportButton.addEventListener('click', () => downloadScene(area));
      exportCell.append(exportButton);
      return row;
    }

    function showAreas(areas) {
      const query = search.value.trim().toLowerCase();
      const matching = areas.filter(area => area.name.toLowerCase().includes(query) &&
        (!filter.value || area.visibility === filter.value)).sort(compareAreas);
      body.replaceChildren(...matching.map(areaRow));
      status.textContent = matching.length
        ? `Showing ${number.format(matching.length)} of ${number.format(areas.length)} areas · wu = world units`
        : 'No areas match your search and visibility filter.';
      for (const button of sortButtons) {
        const active = button.dataset.sort === sortBy;
        if (active) button.parentElement.setAttribute('aria-sort', ascending ? 'ascending' : 'descending');
        else button.parentElement.removeAttribute('aria-sort');
        button.querySelector('.sort-icon').textContent = active ? (ascending ? '↑' : '↓') : '↕';
      }
    }

    try {
      const response = await fetch(statsPath, { cache: 'no-cache' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const { areas, summary, updatedAt } = await response.json();
      const render = () => showAreas(areas);
      showSummary(summary, updatedAt);
      render();
      document.querySelector('.table-scroll').hidden = false;
      search.disabled = false;
      filter.disabled = false;
      search.addEventListener('input', render);
      filter.addEventListener('change', render);
      for (const button of sortButtons) {
        button.addEventListener('click', () => {
          ascending = button.dataset.sort === sortBy ? !ascending : true;
          sortBy = button.dataset.sort;
          render();
        });
      }
    } catch (error) {
      console.error('Kids World could not load area statistics.', error);
      status.textContent = 'Could not load area statistics.';
    }
  </script>
</body>
</html>
